
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Hiro Marker - Red Cube AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; sourceWidth: 480; sourceHeight: 640; videoTexture: false; debugUIEnabled: false;">

    <!-- Hiro Marker -->
    <a-marker
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2">

      <!-- Red 3D Cube -->
      <a-box
        position="0 0.25 0"
        width="0.5"
        height="0.5"
        depth="0.5"
        material="color: red;">
      </a-box>

    </a-marker>

    <!-- AR Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
